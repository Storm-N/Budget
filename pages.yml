# This workflow is an automated recipe GitHub follows to publish the website.
name: Deploy StudentBudget to GitHub Pages

# Start after a push to main, or when manually started from GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant only the permissions needed to read files and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# A job is a group of steps run on a GitHub hosted computer.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # These steps get the files, prepare Pages, upload the site, and publish it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
